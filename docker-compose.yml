services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shiksha
      POSTGRES_USER: shiksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiksha -d shiksha"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: build
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment:
      DATABASE_URL: postgresql://shiksha:${POSTGRES_PASSWORD}@database:5432/shiksha
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://shiksha:${POSTGRES_PASSWORD}@database:5432/shiksha
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      PORT: 8000
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      TRUST_PROXY: "true"
      AI_PROVIDER_URL: ${AI_PROVIDER_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
